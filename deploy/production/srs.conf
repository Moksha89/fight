listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     off;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtc_to_rtmp on;
    }
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      12;
    }
    dvr {
        enabled         on;
        dvr_plan        segment;
        dvr_duration    3600;
        dvr_path        ./objs/nginx/html/recordings/[app]/[stream].[timestamp].flv;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    http_hooks {
        enabled       on;
        on_publish    http://app:8765/api/cockfight/broadcast/hooks/srs/publish/?secret=$ROOSTERRUN_SRS_HOOK_SECRET;
        on_unpublish  http://app:8765/api/cockfight/broadcast/hooks/srs/unpublish/?secret=$ROOSTERRUN_SRS_HOOK_SECRET;
        on_dvr        http://app:8765/api/cockfight/broadcast/hooks/srs/recording/?secret=$ROOSTERRUN_SRS_HOOK_SECRET;
    }
}
