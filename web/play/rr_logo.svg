<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="lBody" x1="70" y1="55" x2="180" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset=".45" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#8a5210"/>
    </linearGradient>
    <linearGradient id="lNeck" x1="60" y1="120" x2="150" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8801a"/>
      <stop offset="1" stop-color="#6b3d0a"/>
    </linearGradient>
    <linearGradient id="lComb" x1="70" y1="8" x2="150" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#ffb43a"/>
      <stop offset="1" stop-color="#e0850f"/>
    </linearGradient>
    <linearGradient id="lBeak" x1="150" y1="95" x2="222" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="1" stop-color="#c9700f"/>
    </linearGradient>
    <radialGradient id="lGlow" cx="0.46" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- back / neck plumage: sharp layered pointed feathers flowing down-left -->
  <g stroke="#5a3608" stroke-width="2" stroke-linejoin="round">
    <path fill="url(#lNeck)" d="M98 92 C56 100 34 146 44 202 C60 176 74 170 90 176 C78 148 84 116 110 104 Z"/>
    <path fill="url(#lNeck)" d="M108 100 C72 116 58 160 72 214 C88 190 102 186 118 192 C102 162 100 128 122 114 Z"/>
    <path fill="url(#lNeck)" d="M120 108 C90 128 82 168 100 218 C114 198 128 196 144 202 C126 170 120 138 134 122 Z"/>
    <path fill="#ffd76a" opacity=".45" d="M104 104 C74 118 62 156 74 202 C82 178 90 168 100 162 C92 142 92 120 108 110 Z"/>
  </g>

  <!-- comb (sharp flame crest) -->
  <path fill="url(#lComb)" stroke="#8a5410" stroke-width="2.5" stroke-linejoin="round"
    d="M104 68 C92 44 104 34 92 14 C112 22 118 42 122 50 C126 26 140 18 140 2 C150 24 148 42 150 52 C158 32 172 28 178 16 C180 40 168 56 158 66 C176 58 188 60 198 52 C190 74 170 78 154 78 C136 84 116 82 104 68 Z"/>

  <!-- head -->
  <path fill="url(#lBody)" stroke="#7a4a0c" stroke-width="3" stroke-linejoin="round"
    d="M150 66 C186 70 208 96 206 128 C204 160 176 182 142 180 C110 178 88 154 88 122 C88 92 114 62 150 66 Z"/>

  <!-- cheek highlight -->
  <path fill="#fff0c0" opacity=".55"
    d="M150 84 C176 86 190 104 188 126 C170 112 150 108 132 116 C134 96 140 84 150 84 Z"/>

  <!-- eye -->
  <g>
    <path d="M150 104 C138 106 132 118 140 128 C150 138 170 134 172 118 C173 106 162 102 150 104 Z" fill="#1a0202"/>
    <ellipse cx="156" cy="116" rx="13" ry="12" fill="#ffd23c"/>
    <circle cx="159" cy="117" r="6.5" fill="#1a0202"/>
    <circle cx="156.5" cy="114" r="2.2" fill="#fff"/>
    <!-- angry brow -->
    <path d="M132 98 C146 92 166 92 180 100 C168 100 150 100 138 106 Z" fill="#7a4a0c"/>
  </g>

  <!-- beak (open, aggressive) -->
  <path fill="url(#lBeak)" stroke="#8a5210" stroke-width="2" stroke-linejoin="round"
    d="M198 112 C216 112 230 120 226 128 C214 130 206 132 198 134 C200 126 199 118 198 112 Z"/>
  <path fill="url(#lBeak)" stroke="#8a5210" stroke-width="2" stroke-linejoin="round"
    d="M198 138 C214 140 224 146 220 152 C210 154 202 152 197 148 C197 144 197 141 198 138 Z"/>
  <path d="M199 134 C208 133 214 133 221 130 C214 137 208 138 199 138 Z" fill="#5a3608" opacity=".7"/>

  <!-- wattle -->
  <path fill="#e0850f" stroke="#8a5410" stroke-width="2" stroke-linejoin="round"
    d="M182 150 C186 172 178 190 166 196 C160 178 162 162 172 150 Z"/>
</svg>
