<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="tHandL" x1="40" y1="70" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bf3c1"/>
      <stop offset=".5" stop-color="#2bc46e"/>
      <stop offset="1" stop-color="#0f7a3f"/>
    </linearGradient>
    <linearGradient id="tHandR" x1="210" y1="70" x2="110" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fe6a8"/>
      <stop offset=".5" stop-color="#1eae5c"/>
      <stop offset="1" stop-color="#0a6231"/>
    </linearGradient>
    <radialGradient id="tGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#38d17a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#38d17a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="118" rx="116" ry="112" fill="url(#tGlow)"/>

  <!-- LEFT arm: forearm from bottom-left up to the clasp -->
  <path fill="url(#tHandL)" stroke="#063a20" stroke-width="4" stroke-linejoin="round"
    d="M20 210 C36 176 60 150 92 132 L118 150 C104 174 86 198 66 220 C50 222 32 220 20 210 Z"/>
  <!-- LEFT hand / palm meeting point -->
  <path fill="url(#tHandL)" stroke="#063a20" stroke-width="4" stroke-linejoin="round"
    d="M92 132 C108 122 126 122 140 132 C150 140 150 156 140 166 L118 150 Z"/>

  <!-- RIGHT arm: forearm from bottom-right up to the clasp -->
  <path fill="url(#tHandR)" stroke="#053018" stroke-width="4" stroke-linejoin="round"
    d="M220 210 C204 176 180 150 148 132 L122 150 C136 174 154 198 174 220 C190 222 208 220 220 210 Z"/>

  <!-- RIGHT hand fingers wrapping over the clasp (4 fingers) -->
  <g fill="url(#tHandR)" stroke="#053018" stroke-width="3.5" stroke-linejoin="round">
    <path d="M112 120 C120 112 132 112 138 122 C140 134 134 146 124 150 C114 148 108 132 112 120 Z"/>
    <path d="M128 112 C137 105 149 106 154 117 C156 129 150 141 140 145 C129 142 124 125 128 112 Z"/>
    <path d="M144 108 C153 102 165 104 169 115 C171 127 164 138 154 141 C143 137 139 120 144 108 Z"/>
    <path d="M160 108 C169 103 180 106 183 117 C184 128 177 138 168 140 C158 136 155 119 160 108 Z"/>
  </g>
  <!-- RIGHT thumb over the top -->
  <path fill="url(#tHandR)" stroke="#053018" stroke-width="3.5" stroke-linejoin="round"
    d="M108 134 C104 122 110 112 122 110 C130 118 132 130 126 140 C119 142 112 140 108 134 Z"/>

  <!-- sheen -->
  <path fill="#e2ffef" opacity=".38" d="M40 196 C54 168 76 146 100 132 C82 152 66 178 56 202 Z"/>
</svg>
